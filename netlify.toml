# Netlify config for the NBFC Market & Valuation dashboard (mobile).
# Publishes ONLY market-dashboard/ — the Streamlit app in the repo root is untouched.

[build]
  publish  = "market-dashboard"
  functions = "market-dashboard/netlify/functions"
  command  = ""

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Static assets are content-addressed by ?v= query in index.html
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
